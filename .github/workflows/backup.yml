name: DB backup

# Supabase 데이터를 매일 밤 내보내 age로 암호화한 뒤 Actions 아티팩트로 남긴다.
#
# ⚠️ 이 저장소는 **공개**다. 워크플로 로그와 아티팩트는 누구나 볼 수 있다고
# 가정한다. 그래서:
#   - 평문(테이블 JSON)은 러너의 임시 디렉터리에만 있다가 지워진다.
#   - 올리는 것은 암호화된 `.tar.age`와, 테이블 이름·행 수만 담긴 manifest.json뿐이다.
#   - 스크립트는 응답 본문을 찍지 않는다(orders에 이름·이메일·전화·주소가 있다).
#   - 개인 키는 GitHub에 없다. 여기서는 공개 키(scripts/backup/recipients.txt)로
#     잠그기만 하고, 푸는 것은 오프라인에서만 한다.
on:
  schedule:
    # 18:17 UTC = 03:17 KST. 트래픽이 가장 적은 시간이고, 정각을 피하는 이유는
    # GitHub의 스케줄 실행이 정각에 몰려 지연·누락되기 쉽기 때문이다.
    - cron: '17 18 * * *'
  workflow_dispatch:
  # 스크립트나 이 파일을 고치는 PR에서는 시크릿 없이 순수 로직 테스트만 돈다.
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup.yml'

# 기본 토큰은 읽기만. 아티팩트 업로드에는 contents 쓰기 권한이 필요 없다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 로컬 개발·CI와 같은 메이저. JSON.parse reviver의 원문 접근이 필요하다.
          node-version: 24
      - name: Test backup logic
        run: node --test scripts/backup/lib.test.mjs

  backup:
    # PR에서는 돌지 않는다. PR(특히 포크)에는 시크릿이 없고, 있어서도 안 된다.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 수동 실행과 스케줄이 겹쳐도 한 번에 하나만. 취소하지 않는 이유: 이미
    # 돌고 있는 백업을 끊으면 그날 백업이 없는 채로 끝날 수 있다.
    concurrency:
      group: db-backup
      cancel-in-progress: false
    env:
      # age 공식 릴리스를 버전과 SHA-256으로 고정한다. apt의 age(1.1~1.2)는
      # 포스트퀀텀 수신자(age1pq…)를 모른다 — 아티팩트가 공개로 내려받아지므로
      # "지금 저장해 두고 나중에 푸는" 공격까지 막으려고 -pq 키를 권한다.
      AGE_VERSION: v1.3.2
      AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 공개 키가 아직 자리표시자면 여기서 멈춘다. 잘못된 수신자로 조용히
      # "성공"하는 것보다, 활성화 전까지 빨갛게 실패하는 편이 낫다.
      - name: Check recipients
        run: |
          set -euo pipefail
          if ! grep -Eq '^age1[0-9a-z]+$' scripts/backup/recipients.txt; then
            echo "::error::scripts/backup/recipients.txt has no age public key yet (see frontend/README.md → 백업)"
            exit 1
          fi

      - name: Install age
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            -o age.tar.gz \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tar.gz" | sha256sum --check --strict -
          mkdir -p age-bin
          tar -xzf age.tar.gz -C age-bin --strip-components=1
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
          age-bin/age --version

      - name: Export tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # 평문은 다른 사용자가 읽을 수 없게 만든다(러너는 일회용이지만 습관으로).
          umask 077
          stamp="$(TZ=Asia/Seoul date +%Y%m%d)"
          name="abovemin-backup-${stamp}"
          echo "BACKUP_NAME=${name}" >> "$GITHUB_ENV"
          node scripts/backup/export.mjs --out "$RUNNER_TEMP/plain/${name}"

      - name: Encrypt
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/upload"
          # tar를 파일로 내리지 않고 바로 age에 흘린다 — 평문 tar가 디스크에 남지 않는다.
          tar -C "$RUNNER_TEMP/plain" -cf - "$BACKUP_NAME" \
            | age -R scripts/backup/recipients.txt -o "$RUNNER_TEMP/upload/${BACKUP_NAME}.tar.age"
          # 암호문 헤더인지 확인한다. 이 검사가 없으면 age가 이상하게 끝났을 때
          # 무엇이 올라가는지 알 수 없다.
          head -c 21 "$RUNNER_TEMP/upload/${BACKUP_NAME}.tar.age" | grep -qx 'age-encryption.org/v1'
          # 매니페스트만 평문으로 곁들인다. 이름·행 수·시각·마이그레이션 파일명뿐이다.
          cp "$RUNNER_TEMP/plain/${BACKUP_NAME}/manifest.json" "$RUNNER_TEMP/upload/manifest.json"
          ls -l "$RUNNER_TEMP/upload"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### ${BACKUP_NAME}"
            echo '```json'
            cat "$RUNNER_TEMP/upload/manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 업로드 디렉터리에는 암호문과 매니페스트만 있다. 평문 디렉터리를 경로로
      # 지정하지 않으므로 실수로 섞여 올라갈 수 없다.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: |
            ${{ runner.temp }}/upload/${{ env.BACKUP_NAME }}.tar.age
            ${{ runner.temp }}/upload/manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/plain"
