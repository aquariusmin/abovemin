name: CI

# PR과 main 푸시에서 돈다. 머지가 곧 배포이므로(브랜치 → PR → 머지), 여기서
# 통과하지 못한 것이 프로덕션에 올라가서는 안 된다.
on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다. 마지막 상태만 의미 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 로컬 개발과 Vercel 런타임에 맞춘다. @types/node도 이 메이저를 따른다.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 빌드까지 해야 의미가 있다. 타입과 린트를 통과해도 프리렌더 단계에서
      # 깨지는 경우가 있다 — generateStaticParams가 데이터를 읽기 때문이다.
      #
      # 실제 자격증명은 넣지 않는다. 빌드 중 Supabase 조회는 실패하고, 각
      # 페이지는 이미 그 경우를 처리하고 있다(빈 목록·에러 상태). 여기서
      # 확인하려는 것은 "데이터가 없어도 빌드가 서는가"이고, 그건 배포가
      # 데이터베이스 사고를 만났을 때 사이트가 어떻게 되는지와 같은 질문이다.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          ADMIN_SESSION_SECRET: ci-placeholder-secret-32-characters
